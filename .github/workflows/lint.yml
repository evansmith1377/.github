name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  yaml-lint:
    name: YAML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              truthy:
                check-keys: false

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  issue-forms-validate:
    name: Validate issue form templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check issue form templates parse and have required keys
        run: |
          python3 - <<'EOF'
          import sys, glob
          import yaml

          failed = False
          for path in glob.glob("ISSUE_TEMPLATE/*.yml"):
              if path.endswith("config.yml"):
                  continue
              with open(path) as f:
                  data = yaml.safe_load(f)
              for key in ("name", "description", "body"):
                  if key not in data:
                      print(f"::error file={path}::missing required key '{key}'")
                      failed = True
          sys.exit(1 if failed else 0)
          EOF
